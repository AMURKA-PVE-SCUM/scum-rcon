; ==============================================================================
; SCUM-RCON Configuration File
; ==============================================================================

[rcon]
; IP address to bind to. Use 0.0.0.0 to listen on all network interfaces.
bind_address    = 0.0.0.0

; Port for incoming RCON connections (default: 28015)
port            = 28015

; REQUIRED: Set your own password!
; The RCON server will NOT start until this password is changed from the default.
password        = CHANGE_ME_BEFORE_USE

; Log connection and authentication attempts (true/false)
auth_log        = true

[quests]
; Comma-separated list of quest asset names or stems to treat as login-lockout hazards.
blocked         = 

; Automatically remove blocked active quests from SCUM.db on server boot (true/false)
auto_unstick             = false
auto_unstick_dry_run     = false
auto_unstick_max_delete  = 100

[logging]
verbose = false
